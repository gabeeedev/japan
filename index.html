<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Japanese Popup Quiz</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script> -->
    <link rel="stylesheet" href="style.css">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

  <script src="lang_sys.js"></script>
  <script src="jap_db.js"></script>

  <script>

    function randomLetter() {

      range = Math.floor(Math.random() * (hiraganaList.length + 1));
      activeLetter = Math.floor(Math.random() * (range));


      document.getElementById("middle").innerHTML = hiraganaList[activeLetter][1];
      state = "romaji";
    }

    function stepLetter() {
      if (state == "romaji") {
        document.getElementById("middle").innerHTML = hiraganaList[activeLetter][0];
        state = "hiragana"
      } else {
        tmp = hiraganaList[activeLetter];
        hiraganaList.splice(activeLetter, 1);
        hiraganaList.push(tmp);
        randomLetter();
      }
    }

    function startVocab(vocab) {
      let vocabs = japanese.find(vocab);

      $(".active-lang").removeClass("active-lang");

      for (const v of vocabs) {
        $("#" + v.link).addClass("active-lang");
      }
    }

    addEventListener("keypress", (e) => {

      if (e.keyCode == 32) {
        stepLetter();
      }
    })

    function init() {
      $("#menu").html(japanese.display());
    }

  </script>
</head>

<body onload="init()">
  <div id="menu">
  </div>
  <div id="middle" onclick="stepLetter()">

  </div>
</body>

</html>
